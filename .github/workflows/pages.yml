name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install PDF renderer
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install deps
        id: npm-install
        run: npm install

      - name: Fix npm binary permissions
        if: steps.npm-install.outcome == 'success'
        run: chmod +x node_modules/.bin/* || true

      - name: Lint
        if: steps.npm-install.outcome == 'success'
        run: npm run lint
        continue-on-error: true

      - name: Notify if install failed
        if: steps.npm-install.outcome == 'failure'
        run: echo "npm install failed"

      - name: Render Rybki slide previews
        if: steps.npm-install.outcome == 'success'
        run: node scripts/render-rybki-pdf-slides.js

      - name: Build and verify static SEO
        if: steps.npm-install.outcome == 'success'
        env:
          REACT_APP_SUBMIT_LEAD_URL: ${{ secrets.REACT_APP_SUBMIT_LEAD_URL }}
          REACT_APP_TRACK_EVENT_URL: ${{ secrets.REACT_APP_TRACK_EVENT_URL }}
          REACT_APP_AI_CHAT_URL: ${{ secrets.REACT_APP_AI_CHAT_URL }}
          REACT_APP_TURNSTILE_SITE_KEY: ${{ secrets.REACT_APP_TURNSTILE_SITE_KEY }}
          REACT_APP_SUPABASE_ANON_KEY: ${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}
          CI: false
        run: npm run build

      - name: Wait for backend changes before publishing the forms
        if: steps.npm-install.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const { execFileSync } = require('child_process');
            const files = execFileSync('git', ['diff', '--name-only', 'HEAD^', 'HEAD'], {encoding: 'utf8'});
            if (!files.split('\n').some(path => /^supabase\/(functions|migrations)\//.test(path))) return;
            for (let attempt = 0; attempt < 40; attempt++) {
              const result = await github.rest.actions.listWorkflowRuns({
                ...context.repo, workflow_id: 'supabase-functions.yml', head_sha: context.sha, per_page: 10
              });
              const run = result.data.workflow_runs.find(item => item.head_sha === context.sha);
              if (run?.status === 'completed') {
                if (run.conclusion !== 'success') throw new Error('Backend deployment did not succeed; keeping the current site live.');
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 15000));
            }
            throw new Error('Backend deployment is not confirmed; keeping the current site live.');

      - name: Stamp the deployment revision
        env:
          DEPLOYMENT_SHA: ${{ github.sha }}
        run: node -e "require('fs').writeFileSync('build/deployment.json', JSON.stringify({sha:process.env.DEPLOYMENT_SHA}))"

      - name: Deploy to gh-pages
        if: steps.npm-install.outcome == 'success'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          publish_branch: gh-pages
          cname: studio.anix-ai.pro

      - name: Verify production attribution on desktop and mobile
        env:
          QA_BASE_URL: https://studio.anix-ai.pro
          QA_EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/attribution-browser-qa.js

      - name: Upload production attribution QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-attribution-qa
          path: artifacts/attribution-qa/
          if-no-files-found: warn
